services:
  - type: web
    name: oop-backend-new
    runtime: docker
    # Paths are relative to the repository root. This service must remain a
    # Docker web service; configuring it as a Node service bypasses the JDK.
    dockerfilePath: backend/Dockerfile
    dockerContext: backend
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: CORS_ORIGIN
        sync: false
